<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="cc-token" content="__CC_TOKEN__"><title>Command Center</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body>
<a class="skip" href="#content">Skip to board</a>
<aside id="sidebar"><a class="brand" href="/" aria-label="Command Center home"><span class="brand-mark">C</span><span>COMMAND<span class="brand-sub">CENTER</span></span></a><div class="sidebar-label">WORKSPACE</div><nav id="repo-nav" aria-label="Repositories"></nav><div class="sidebar-bottom"><div class="local"><i></i> Local workspace</div><button id="settings-nav" class="nav-item">⚙ <span>Settings</span></button></div></aside>
<main id="content" tabindex="-1"><header class="topbar"><button id="menu" aria-label="Toggle repository navigation">☰</button><span id="breadcrumb">Workspace <span>/</span> All repositories</span><span class="top-right">PERSONAL FACTORY <span class="connection" id="connection">Connecting</span></span></header>
<section class="workspace-heading"><div><p class="eyebrow" id="eyebrow">YOUR WORK, IN MOTION</p><h1 id="title">All repositories</h1><p id="subtitle">One workspace. Every step from idea to pull request.</p></div><div class="heading-actions"><button id="run-queue">▷ Run queue</button><button id="create-issue" class="primary">＋ Create issue</button></div></section>
<div id="notices" aria-live="polite"></div><div id="board-view"><div class="toolbar"><div class="view-tabs"><button class="tab active" id="board-tab">▦ Board</button><button class="tab" id="history-tab">◷ History</button></div><div class="filters"><label class="search"><span>⌕</span><input id="search" type="search" aria-label="Search cards" placeholder="Search work…"></label><select id="status-filter" aria-label="Filter by stage"><option value="">All stages</option></select><button id="refresh" aria-label="Refresh GitHub and local state">↻</button></div></div><div class="board-meta"><span id="card-count">Loading work…</span><span id="capacity"></span></div><div id="board" class="board" aria-label="Workflow board"></div></div><section id="settings-view" hidden></section>
<footer><span>COMMAND CENTER</span><span id="footer-status">Connecting to your workspace…</span></footer></main>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="dialog-heading"><span class="eyebrow" id="drawer-label">WORK DETAILS</span><button id="close-drawer" aria-label="Close details">✕</button></div><div id="drawer-content"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
